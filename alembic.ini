# Migrations PostgreSQL de FRAMATEX (Alembic). SQLite conserve son migrateur historique (app/migrate.py).
# L'adresse de la base vient de DATABASE_URL (jamais écrite ici) ; exécution contrôlée :
#   python -m app.db upgrade        (verrou consultatif : un seul processus migre)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
